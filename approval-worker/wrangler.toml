name = "sap-signal-approval"
main = "src/index.js"
compatibility_date = "2025-06-01"

# One cron: the weekly draft, Sunday 00:30 UTC = 06:00 IST, on time. (Cloudflare's free plan allows 5 crons
# per ACCOUNT; Undercurrent's worker uses 4, so this is the last one.) GitHub's schedule stays as a backup.
[triggers]
crons = ["30 0 * * 0"]

[vars]
# owner/repo that holds the SAP Signal pipeline
GITHUB_REPO = "sachinssoni-GPT/sap-signal"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   APPROVAL_SECRET  same value as the GitHub Actions secret APPROVAL_SECRET (a NEW one, not Undercurrent's)
#   GITHUB_TOKEN     fine-grained PAT, the sap-signal repo only, permission "Contents: Read and write"
