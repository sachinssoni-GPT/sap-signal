  vendor:                 # interested parties: used, but never alone, and labelled
    - community.sap.com
    - blogs.sap.com
    - riministreet.com
    - spinnakersupport.com
    - support-revolution.com
    - leverx.com
    - accenture.com
    - deloitte.com
    - capgemini.com
    - infosys.com
    - tcs.com
    - wipro.com
    - ibm.com
    - prnewswire.com
    - businesswire.com
    - globenewswire.com
  aggregator:
    - news.google.com
    - msn.com
    - news.yahoo.com
    - flipboard.com
    - reddit.com
    - linkedin.com

paths:
  db: data/editorial.db
  drafts: content/drafts
  published: content/published
  rejected: content/rejected
  reports: reports
  notes: notes
  deadlines: deadlines.yaml

verbose_agents: false

# Outlets with the same owner count as ONE outlet when judging how widely a story is carried.
source_owners:
  wellesley: [erp.today, sapinsider.org, masteringsap.com]

source_perspectives:
  sap_official: [sap.com, news.sap.com, help.sap.com]
  user_group: [dsag.de, asug.com, ukisug.co.uk]
  financial_press: [reuters.com, bloomberg.com, ft.com, wsj.com, cnbc.com, handelsblatt.com]
  sap_trade_press: [theregister.com, diginomica.com, erp.today, sapinsider.org, insidesap.com, e3mag.com]
  interested_party: [riministreet.com, spinnakersupport.com, support-revolution.com]
