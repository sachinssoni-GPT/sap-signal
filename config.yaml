    - diginomica.com
    - erp.today
    - sapinsider.org
    - insidesap.com
    - computerweekly.com
    - computerwoche.de
    - cio.com
    - techtarget.com
    - zdnet.com
    - itpro.com
    - siliconangle.com
    - techcrunch.com
    - venturebeat.com
    - e3mag.com
  research_institution:
    - gartner.com
    - forrester.com
    - idc.com
    - constellationr.com
  regional_press:
    - economictimes.indiatimes.com
    - livemint.com
