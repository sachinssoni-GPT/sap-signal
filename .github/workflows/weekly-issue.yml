name: Weekly issue (draft for approval)

on:
  schedule:
    - cron: "30 12 * * 1"       # Monday 18:00 IST: this week's draft
    - cron: "30 15 * * 1"       # backup (GitHub's scheduler can skip a run): does nothing if the draft exists
  workflow_dispatch:
    inputs:
      force:
        description: "Make a new draft even if one was made in the last 5 days"
        type: boolean
        default: false
  repository_dispatch:
    types: [sig-regenerate, sig-run]   # Regenerate button / "Build a new draft now" (Telegram control panel)

permissions:
  contents: write

concurrency:
  group: sig-content
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVENT_ACTION: ${{ github.event.action }}
      INPUT_FORCE: ${{ github.event.inputs.force }}
      INPUT_EDITION: ${{ github.event.client_payload.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick up notes sent since the last collection
        run: python main.py collect-notes || true

      - name: Generate the issue
        id: run
        run: |
          if [ "$EVENT_ACTION" = "sig-regenerate" ]; then
            python main.py reject "$INPUT_EDITION" --reason "regenerate requested" || true
            python main.py run --edition "$INPUT_EDITION"
          elif [ "$INPUT_FORCE" = "true" ] || [ "$EVENT_ACTION" = "sig-run" ]; then
            python main.py run --force
          else
            python main.py run
          fi

      - name: Commit draft and history
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data notes
          git commit -m "draft: issue ${{ steps.run.outputs.edition }} (${{ steps.run.outputs.status }})" || echo "nothing to commit"
          git pull --rebase --autostash
          git push

      - name: Email + Telegram the draft
        if: steps.run.outputs.status == 'draft_ready'
        run: python main.py notify draft --edition "${{ steps.run.outputs.edition }}"

      - name: Tell me why there is no issue
        if: steps.run.outputs.status == 'no_story'
        run: python main.py notify no-story

      - name: Run report (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Alert on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="SAP Signal weekly run FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
