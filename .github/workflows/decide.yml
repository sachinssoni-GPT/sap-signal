name: Approve or reject issue

on:
  repository_dispatch:
    types: [sig-approve, sig-reject]   # signed buttons in the email/Telegram, via the approval Worker
  workflow_dispatch:
    inputs:
      date:
        description: "Issue id (YYYY-MM-DD)"
        required: true
      decision:
        type: choice
        options: [approve, reject]
        default: approve
      reason:
        description: "Reason (for reject)"
        required: false

permissions:
  contents: write

concurrency:
  group: sig-content
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EDITION: ${{ github.event.client_payload.date || github.event.inputs.date }}
      DECISION: ${{ github.event.action || github.event.inputs.decision }}
      REASON: ${{ github.event.client_payload.reason || github.event.inputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-publish.txt   # light: no CrewAI needed to approve

      - name: Apply decision
        run: |
          case "$DECISION" in
            sig-approve|approve) python main.py approve "$EDITION" --notify ;;
            sig-reject|reject)   python main.py reject "$EDITION" --reason "$REASON" --notify ;;
            *) echo "unknown decision: $DECISION"; exit 1 ;;
          esac

      - name: Commit
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content data notes deadlines.yaml
          git commit -m "${DECISION#sig-}: issue $EDITION" || echo "nothing to commit"
          git pull --rebase --autostash
          git push

      - name: Alert on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="Approve/reject for ${EDITION} FAILED: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
