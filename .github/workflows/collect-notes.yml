name: Collect notes for the Take

# Telegram keeps unread bot messages for about a day, so your /take messages and voice notes are saved
# into notes/ every few hours. The next weekly run writes the Take from them.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sig-content
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-publish.txt
      - run: python main.py collect-notes
      - name: Commit notes
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes data/telegram_offset.txt 2>/dev/null || true
          git commit -m "notes: collected" || echo "nothing new"
          git pull --rebase --autostash
          git push
